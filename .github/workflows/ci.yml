name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
                  -latest -property installationPath
          $cf = Join-Path $vs 'VC\Tools\Llvm\x64\bin\clang-format.exe'
          $files = Get-ChildItem -Recurse -Include *.cpp,*.hpp -Path engine
          & $cf --style=file --dry-run --Werror @($files.FullName)
          exit $LASTEXITCODE

  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
      - name: Check formatting
        run: dotnet format sotto.slnx --verify-no-changes
      - name: Build
        run: dotnet build sotto.slnx
      # This job has no engine binary; the contract job runs what needs one.
      - name: Test
        run: dotnet test app/Sotto.Client.Tests --no-build --blame-hang-timeout 120s
      - name: Test app view models
        run: dotnet test app/Sotto.App.Tests --no-build --filter "Requires!=Engine" --blame-hang-timeout 120s

  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
      - name: Build engine and run the contract suite
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
                  -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64'
          cmake --workflow --preset dev
          dotnet test app/Sotto.Contract.Tests --blame-hang-timeout 120s
          dotnet test app/Sotto.App.Tests --filter "Requires=Engine" --blame-hang-timeout 120s

  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, release]
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
                  -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64'
          cmake --workflow --preset ${{ matrix.preset }}
